name: Actualizar noticias

on:
  schedule:
    - cron: "17 6 * * *"   # todos los días a las 06:17 UTC (08:17 en Madrid en verano)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generar_noticias.py
      - name: Guardar cambios
        run: |
          git config user.name "ciberpedia-bot"
          git config user.email "ciberpedia-bot@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || git commit -m "Noticias $(date -u +%F)"
          git push
