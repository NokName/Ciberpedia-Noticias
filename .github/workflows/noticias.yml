name: Actualizar noticias

on:
  schedule:
    - cron: "0 */5 * * *"    # cada 5 horas, en sintonía con la tarea del artefacto
  push:
    paths:
      - generar_noticias.py  # se ejecuta también al cambiar el generador
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generar_noticias.py
      - name: Guardar cambios
        run: |
          git config user.name "ciberpedia-bot"
          git config user.email "ciberpedia-bot@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || git commit -m "Noticias $(date -u +%F)"
          git push
